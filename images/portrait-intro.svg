<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2">
  <title id="t2">Abstract editorial still-life illustration representing a calm space</title>
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFDCC9"/>
      <stop offset="55%" stop-color="#F1E8D9"/>
      <stop offset="100%" stop-color="#E4E9DD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad2)"/>

  <circle cx="70" cy="80" r="60" fill="#8C9A7B" opacity="0.14"/>
  <circle cx="350" cy="440" r="80" fill="#C6875C" opacity="0.12"/>

  <!-- table line -->
  <line x1="0" y1="360" x2="400" y2="360" stroke="#2B2A26" stroke-opacity="0.08" stroke-width="2"/>

  <!-- vase -->
  <path d="M170 360 L172 300 C172 288 228 288 228 300 L230 360 Z" fill="#66755A"/>
  <ellipse cx="200" cy="360" rx="30" ry="7" fill="#55524A" opacity="0.15"/>

  <!-- eucalyptus stems -->
  <g stroke="#66755A" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M200 300 C190 250 170 210 150 170"/>
    <path d="M204 300 C210 240 220 190 210 130"/>
    <path d="M196 300 C205 260 230 230 250 190"/>
  </g>
  <g fill="#8C9A7B">
    <ellipse cx="160" cy="220" rx="10" ry="6" transform="rotate(-30 160 220)"/>
    <ellipse cx="150" cy="190" rx="9" ry="5" transform="rotate(-20 150 190)"/>
    <ellipse cx="214" cy="220" rx="10" ry="6" transform="rotate(15 214 220)"/>
    <ellipse cx="212" cy="180" rx="9" ry="5" transform="rotate(10 212 180)"/>
    <ellipse cx="208" cy="150" rx="8" ry="5" transform="rotate(5 208 150)"/>
    <ellipse cx="234" cy="212" rx="9" ry="5" transform="rotate(40 234 212)"/>
    <ellipse cx="246" cy="196" rx="8" ry="5" transform="rotate(35 246 196)"/>
  </g>

  <!-- warm mug -->
  <path d="M100 360 L100 320 C100 312 140 312 140 320 L140 360 Z" fill="#C6875C" opacity="0.9"/>
  <path d="M140 328 C156 328 156 350 140 350" fill="none" stroke="#C6875C" stroke-width="4" opacity="0.9"/>
  <path d="M108 316 C110 306 112 300 108 292" fill="none" stroke="#EFDCC9" stroke-width="2" opacity="0.7"/>
  <path d="M120 314 C122 304 124 298 120 290" fill="none" stroke="#EFDCC9" stroke-width="2" opacity="0.6"/>

  <!-- open notebook -->
  <path d="M250 358 L250 336 L310 328 L370 336 L370 358 Z" fill="#FCFAF5" stroke="#E2D6C2" stroke-width="1.5"/>
  <line x1="310" y1="330" x2="310" y2="358" stroke="#E2D6C2" stroke-width="1.5"/>
  <line x1="262" y1="342" x2="300" y2="339" stroke="#C6C0AE" stroke-width="1.5"/>
  <line x1="262" y1="348" x2="298" y2="345" stroke="#C6C0AE" stroke-width="1.5"/>
  <line x1="320" y1="339" x2="358" y2="342" stroke="#C6C0AE" stroke-width="1.5"/>
  <line x1="322" y1="345" x2="356" y2="348" stroke="#C6C0AE" stroke-width="1.5"/>
</svg>
